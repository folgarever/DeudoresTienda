<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>DeudoresTienda — Control de Clientes, Ventas y Deudas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Administración de clientes, cuentas por cobrar, registro de ventas y control de abonos de una tienda.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
  <link rel="apple-touch-icon" href="logo-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- PWA: comportamiento al instalar en iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeudoresTienda">
  <!-- Tipografia Inter (Sistema Visual Uber) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Aplica el tema guardado antes de que cargue Angular (evita el destello). -->
  <script>
    try {
      if (localStorage.getItem('deudores_tema') === 'dark') {
        document.body.classList.add('theme-dark');
      }
    } catch (e) {}
  </script>
  <app-root></app-root>
</body>
</html>
